
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/jpeg" href="/image/logo.jpeg" />
      <link rel="apple-touch-icon" href="/image/logo.jpeg" />
      <title>Moreadorn — Global Trade Co.</title>
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }

        /* Splash overlay — sits on top of app for 3s, then fades out */
        #splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(ellipse at center, #1a1a1a 0%, #0B0B0B 70%);
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
          transition: opacity 600ms ease, visibility 600ms ease;
          opacity: 1;
          visibility: visible;
        }
        #splash.hide {
          opacity: 0;
          visibility: hidden;
        }
        #splash::before {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 20% 30%, rgba(200,169,106,0.18), transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(230,211,163,0.12), transparent 40%);
          pointer-events: none;
        }
        .splash-inner {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 28px;
          animation: splash-rise 700ms ease-out both;
        }
        .splash-logo-wrap {
          position: relative;
          width: 140px;
          height: 140px;
          border-radius: 28px;
          overflow: hidden;
          box-shadow:
            0 0 0 1px rgba(200,169,106,0.35),
            0 30px 80px -20px rgba(200,169,106,0.45),
            0 0 60px rgba(200,169,106,0.25);
          background: linear-gradient(135deg, #C8A96A, #E6D3A3);
          padding: 3px;
          animation: splash-pulse 2.4s ease-in-out infinite;
        }
        .splash-logo-wrap img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 25px;
          display: block;
        }
        .splash-ring {
          position: absolute;
          inset: -14px;
          border-radius: 36px;
          border: 1px solid rgba(200,169,106,0.4);
          animation: splash-ring 2.4s ease-in-out infinite;
        }
        .splash-brand {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: #FAF8F3;
          letter-spacing: 0.35em;
          font-size: 14px;
          font-weight: 500;
          text-transform: uppercase;
          opacity: 0.9;
        }
        .splash-tag {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: #C8A96A;
          font-size: 11px;
          letter-spacing: 0.4em;
          text-transform: uppercase;
          opacity: 0.75;
          margin-top: -16px;
        }
        .splash-bar {
          width: 180px;
          height: 2px;
          background: rgba(255,255,255,0.08);
          border-radius: 2px;
          overflow: hidden;
          margin-top: 4px;
        }
        .splash-bar::after {
          content: "";
          display: block;
          width: 40%;
          height: 100%;
          background: linear-gradient(90deg, transparent, #C8A96A, #E6D3A3, transparent);
          animation: splash-load 1.6s ease-in-out infinite;
        }
        @keyframes splash-rise {
          from { opacity: 0; transform: translateY(12px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); }
          50%      { transform: scale(1.04); }
        }
        @keyframes splash-ring {
          0%, 100% { transform: scale(1); opacity: 0.4; }
          50%      { transform: scale(1.08); opacity: 0.7; }
        }
        @keyframes splash-load {
          0%   { transform: translateX(-100%); }
          100% { transform: translateX(350%); }
        }
        @media (prefers-reduced-motion: reduce) {
          .splash-logo-wrap, .splash-ring, .splash-bar::after, .splash-inner {
            animation: none !important;
          }
        }
      </style>
    </head>

    <body>
      <div id="splash" aria-hidden="true">
        <div class="splash-inner">
          <div class="splash-logo-wrap">
            <span class="splash-ring"></span>
            <img src="/image/logo.jpeg" alt="Moreadorn" />
          </div>
          <div class="splash-brand">Moreadorn</div>
          <div class="splash-tag">Global Trade Co.</div>
          <div class="splash-bar"></div>
        </div>
      </div>

      <div id="root"></div>

      <script>
        (function () {
          var splash = document.getElementById('splash');
          if (!splash) return;
          var hide = function () {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 700);
          };
          window.addEventListener('load', function () {
            setTimeout(hide, 4000);
          });
        })();
      </script>

      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
